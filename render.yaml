databases:
  - name: betweenus-db
    plan: free
    databaseName: betweenus
    user: betweenus

services:
  - type: web
    name: betweenus
    runtime: python
    buildCommand: bash build.sh
    startCommand: python -m daphne -b 0.0.0.0 -p $PORT config.asgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: betweenus-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: REDIS_URL
        sync: false

