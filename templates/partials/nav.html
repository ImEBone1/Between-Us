<header class="topbar">
  <a class="brand" href="{% url 'dashboard' %}" aria-label="BetweenUs home">
    <span class="brand-heart">♡</span><span>Between<span class="brand-accent">Us</span></span>
  </a>
  <nav class="main-nav" aria-label="Main navigation">
    <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}">Today</a>
    <a class="nav-link {% if request.resolver_match.url_name == 'moments' %}active{% endif %}" href="{% url 'moments' %}">Our moments</a>
    <a class="nav-link {% if request.resolver_match.url_name == 'notifications' %}active{% endif %}" href="{% url 'notifications' %}">Notes{% if unread_count %}<span class="nav-count">{{ unread_count }}</span>{% endif %}</a>
  </nav>
  <div class="nav-actions">
    <a class="icon-button" href="{% url 'settings' %}" aria-label="Settings" title="Settings">⚙</a>
    <div class="mini-avatar avatar-{{ user.profile.avatar_color }}">{{ user.profile.initials }}</div>
    <form action="{% url 'logout' %}" method="post">{% csrf_token %}<button class="text-button" type="submit">Log out</button></form>
  </div>
</header>
